<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Ritorno a Buoni Mortise</title>

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f2ec;
      color: #222;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(520px, 100%);
      box-sizing: border-box;
      background: #fff;
      border: 1px solid #e7e1d9;
      border-radius: 18px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 25px;
    }

    p {
      margin: 8px 0;
      color: #666;
      line-height: 1.45;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 22px;
      border: 4px solid #e8e3dd;
      border-top-color: #222;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .order {
      margin-top: 14px;
      font-size: 12px;
      color: #999;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>

    <h1>Verifica del pagamento…</h1>

    <p>
      Stiamo verificando l'esito del pagamento Satispay.
    </p>

    <p>
      Tra pochi istanti tornerai alla pagina dei Buoni Mortise.
    </p>

    <div id="order" class="order"></div>
  </main>

  <script>
    (function () {
      const params =
        new URLSearchParams(
          window.location.search
        );

      const order =
        String(
          params.get('order') || ''
        ).trim();

      if (!order) {
        window.location.replace('/');
        return;
      }

      document
        .getElementById('order')
        .textContent =
          'Ordine ' + order;

      window.location.replace(
        '/?satispay_return=' +
        encodeURIComponent(order)
      );
    })();
  </script>
</body>
</html>
